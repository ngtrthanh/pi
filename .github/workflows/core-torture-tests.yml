name: Core Torture Tests

on:
  push:
    branches:
      - feat/risk-pdca-spiral
    paths:
      - 'packages/durable/**'
      - 'packages/server/**'
      - '.github/workflows/core-torture-tests.yml'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-torture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  torture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: T1 Durable side-effect recovery
        working-directory: packages/durable
        run: |
          npx vitest --run             test/harness-tools-recovery.test.ts             test/harness-tasks-recovery.test.ts             --reporter=verbose

      - name: T2 ExecutionEnv portability
        working-directory: packages/durable
        run: |
          npx vitest --run             test/env-portability-contract.test.ts             --reporter=verbose

      - name: T3 Multi-client steering and reconnect
        working-directory: packages/server
        run: |
          npx vitest --run             test/conformance.test.ts             --reporter=verbose             -t "permits multiple client attachments|requires the requesting client|rejects a stale attachment|admits concurrent service calls|admits concurrent service calls from two attached clients|keeps attachment demand|invalidates a terminated Harness handle|connection loss releases"
