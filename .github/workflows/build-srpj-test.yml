name: Build Pi Spiral Test

on:
  push:
    branches:
      - feat/risk-pdca-spiral
    paths:
      - 'packages/**'
      - 'scripts/srpj/**'
      - '.github/workflows/build-srpj-test.yml'
      - 'package*.json'
      - 'tsconfig*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-srpj-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Hydrate model data
        run: npm run hydrate:model-data

      - name: Build monorepo
        run: npm run build:offline

      - name: Check
        run: npm run check

      - name: Build Windows x64
        run: |
          ./scripts/build-binaries.sh             --skip-install             --skip-build             --offline-model-data             --platform windows-x64             --out .artifacts/srpj-windows

          cp scripts/srpj/pi-spiral.cmd .artifacts/srpj-windows/windows-x64/
          cp scripts/srpj/pi-srpj.cmd .artifacts/srpj-windows/windows-x64/
          cp scripts/srpj/README.md .artifacts/srpj-windows/windows-x64/SRPJ_README.md

          cd .artifacts/srpj-windows/windows-x64
          zip -r ../pi-srpj-windows-x64.zip .

      - name: Build Linux x64
        run: |
          ./scripts/build-binaries.sh             --skip-install             --skip-build             --offline-model-data             --platform linux-x64             --out .artifacts/srpj-linux

          cp scripts/srpj/pi-spiral.sh .artifacts/srpj-linux/linux-x64/
          cp scripts/srpj/pi-srpj.sh .artifacts/srpj-linux/linux-x64/
          cp scripts/srpj/README.md .artifacts/srpj-linux/linux-x64/SRPJ_README.md
          chmod +x .artifacts/srpj-linux/linux-x64/pi-spiral.sh .artifacts/srpj-linux/linux-x64/pi-srpj.sh

          cd .artifacts/srpj-linux/linux-x64
          tar -czf ../pi-srpj-linux-x64.tar.gz .

      - name: Upload Windows test build
        uses: actions/upload-artifact@v6
        with:
          name: pi-srpj-windows-x64
          path: .artifacts/srpj-windows/pi-srpj-windows-x64.zip
          if-no-files-found: error

      - name: Upload Linux test build
        uses: actions/upload-artifact@v6
        with:
          name: pi-srpj-linux-x64
          path: .artifacts/srpj-linux/pi-srpj-linux-x64.tar.gz
          if-no-files-found: error
